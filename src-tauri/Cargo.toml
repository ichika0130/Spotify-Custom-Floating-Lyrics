[package]
name = "spotify-lyrics"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "spotify-lyrics"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spotify_lyrics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-shell = "2.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-fs = "2.4.5"

[features]
# Enable Windows-only diagnostic binaries: cargo run --features windows-diagnostics --bin diagnose_smtc
windows-diagnostics = []

[[bin]]
name = "diagnose_smtc"
path = "src/bin/diagnose_smtc.rs"
required-features = ["windows-diagnostics"]

[[bin]]
name = "mock_spotify_session"
path = "src/bin/mock_spotify_session.rs"
required-features = ["windows-diagnostics"]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.52"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Media",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "System",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi"
]
